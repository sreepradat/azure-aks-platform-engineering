name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App - lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements*.txt

      - name: Install dependencies
        run: pip install -r app/requirements.txt -r app/requirements-dev.txt

      - name: Lint
        run: ruff check app

      - name: Test
        working-directory: app
        run: pytest

  terraform:
    name: Terraform - fmt and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Format check
        run: terraform fmt -check -recursive -diff terraform

      - name: Validate (no backend, no Azure access needed)
        working-directory: terraform/environments/dev
        run: |
          terraform init -backend=false -input=false
          terraform validate

  helm:
    name: Helm - lint and render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v4

      - name: Lint
        run: helm lint helm/sample-app

      - name: Render with defaults
        run: helm template sample-app helm/sample-app > /dev/null

      - name: Render with workload identity enabled
        run: |
          helm template sample-app helm/sample-app \
            --set workloadIdentity.enabled=true \
            --set workloadIdentity.clientId=00000000-0000-0000-0000-000000000000 \
            --set workloadIdentity.tenantId=00000000-0000-0000-0000-000000000000 \
            --set workloadIdentity.keyVaultName=kv-example > /dev/null

  security:
    name: Security - IaC and Dockerfile scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Dockerfile lint (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile
          failure-threshold: error

      - name: Terraform scan (Checkov)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          quiet: true
          # Report-only at first. Remove soft_fail once findings are triaged or suppressed with justification.
          soft_fail: true
