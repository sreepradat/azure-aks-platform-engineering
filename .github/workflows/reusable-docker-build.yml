name: Reusable - Build, scan and push image

on:
  workflow_call:
    inputs:
      image-name:
        description: Repository name inside the registry, for example sample-app
        type: string
        required: true
      acr-name:
        description: Azure Container Registry name (without .azurecr.io)
        type: string
        required: true
      context:
        description: Docker build context
        type: string
        default: app
      dockerfile:
        description: Path to the Dockerfile
        type: string
        default: app/Dockerfile
      trivy-severity:
        description: Severities that fail the build
        type: string
        default: CRITICAL,HIGH
      azure-client-id:
        type: string
        required: true
      azure-tenant-id:
        type: string
        required: true
      azure-subscription-id:
        type: string
        required: true
    outputs:
      image-ref:
        description: Full image reference including tag
        value: ${{ jobs.build.outputs.image-ref }}
      image-repository:
        description: Image repository without tag
        value: ${{ jobs.build.outputs.image-repository }}
      image-tag:
        description: Image tag (short commit SHA)
        value: ${{ jobs.build.outputs.image-tag }}

jobs:
  build:
    name: Build, scan, push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image-ref: ${{ steps.meta.outputs.image-ref }}
      image-repository: ${{ steps.meta.outputs.image-repository }}
      image-tag: ${{ steps.meta.outputs.image-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image reference
        id: meta
        env:
          ACR_NAME: ${{ inputs.acr-name }}
          IMAGE_NAME: ${{ inputs.image-name }}
        run: |
          tag="${GITHUB_SHA::7}"
          repository="${ACR_NAME}.azurecr.io/${IMAGE_NAME}"
          {
            echo "image-tag=${tag}"
            echo "image-repository=${repository}"
            echo "image-ref=${repository}:${tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (kept local until it passes the scan)
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.image-ref }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.image-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.image-ref }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: ${{ inputs.trivy-severity }}

      - name: Log in to Azure (OIDC, no stored secrets)
        uses: azure/login@v2
        with:
          client-id: ${{ inputs.azure-client-id }}
          tenant-id: ${{ inputs.azure-tenant-id }}
          subscription-id: ${{ inputs.azure-subscription-id }}

      - name: Push image to ACR
        env:
          ACR_NAME: ${{ inputs.acr-name }}
          IMAGE_REF: ${{ steps.meta.outputs.image-ref }}
        run: |
          az acr login --name "$ACR_NAME"
          docker push "$IMAGE_REF"

      - name: Summary
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image-ref }}
        run: |
          {
            echo "### Image published"
            echo ""
            echo "\`${IMAGE_REF}\`"
          } >> "$GITHUB_STEP_SUMMARY"
