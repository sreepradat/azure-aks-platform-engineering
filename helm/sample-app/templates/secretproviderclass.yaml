{{- if .Values.workloadIdentity.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "sample-app.fullname" . }}-keyvault
  labels:
    {{- include "sample-app.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ .Values.workloadIdentity.clientId | quote }}
    tenantId: {{ .Values.workloadIdentity.tenantId | quote }}
    keyvaultName: {{ required "workloadIdentity.keyVaultName is required when workloadIdentity.enabled=true" .Values.workloadIdentity.keyVaultName | quote }}
    objects: |
      array:
        - |
          objectName: {{ .Values.workloadIdentity.secretName }}
          objectType: secret
{{- end }}
